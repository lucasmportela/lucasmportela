name: CI - Portfólio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - Sintaxe, segurança e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            SistemaContasBancarias/requirements.txt
            SistemaAutenticacao/backend/requirements.txt
            SistemaDeFaturamentoDeProdutos/backend/requirements.txt

      - name: Verificar sintaxe de todos os arquivos Python
        run: python -m compileall -q .

      - name: Instalar dependências dos projetos Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r SistemaContasBancarias/requirements.txt
          python -m pip install -r SistemaAutenticacao/backend/requirements.txt
          python -m pip install -r SistemaDeFaturamentoDeProdutos/backend/requirements.txt

      - name: Executar testes unitários e de integração do Conta+
        run: python -m unittest discover -s SistemaContasBancarias/tests -v

      - name: Executar testes de segurança do Sistema de Autenticação
        run: python -m unittest discover -s SistemaAutenticacao/backend/tests -v

      - name: Executar testes de configuração do Sistema de Faturamento
        run: python -m unittest discover -s SistemaDeFaturamentoDeProdutos/backend/tests -v

  rack-monitor-backend:
    name: Rack Monitor - testes de integração da API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do backend
        working-directory: MonitoramentoRackDataCenter/backend
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe do backend
        run: node --check MonitoramentoRackDataCenter/backend/server.js

      - name: Executar testes de integração do Rack Monitor
        working-directory: MonitoramentoRackDataCenter/backend
        run: npm test

  frontend:
    name: Build - ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Rack Monitor
            directory: MonitoramentoRackDataCenter/frontend
          - project: Sistema de Faturamento
            directory: SistemaDeFaturamentoDeProdutos/frontend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund

      - name: Gerar build de produção
        working-directory: ${{ matrix.directory }}
        run: npm run build
